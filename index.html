<!DOCTYPE html>
<html>
<head>
<title>Birthday Card</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #FF87D8, #37BFC4);
    font-family: Bebas;
    text-align: center;
}

h1 {
    margin-top: 60px;
    font-size: 60px;
    color: purple;
}

p {
    font-size: 24px;
    color: white;
}

.balloon-wrapper {
    position: absolute;
    animation: float 5s infinite ease-in-out;
}

.balloon {
    width: 110px;
    height: 130px;
    border-radius: 50%;
    cursor: pointer;

    box-shadow:
        inset -10px -15px 20px rgba(0,0,0,0.2),
        inset 10px 10px 20px rgba(255,255,255,0.3),
        0 10px 20px rgba(0,0,0,0.2);
}

.balloon::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 40px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    top: 20px;
    left: 20px;
    transform: rotate(25deg);
    filter: blur(8px);
}

.string {
    width: 2px;
    height: 60px;
    background: rgba(0, 0, 0, 0.3);
    margin: 0 auto;
}

.red {
    background: red;
}

.blue {
    background: blue;
}

.yellow {
    background: gold;
}

.red-wrapper {
    left: 40%;
    top: 55%;
}

.blue-wrapper {
    left: 45%;
    top: 65%;
}

.yellow-wrapper {
    left: 70%;
    top: 55%;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-40px); }
    100% { transform: translateY(0px); }
}

.confetti {
    position: absolute;
    font-size: 25px;
    animation: explode 2s linear forwards;
}

@keyframes explode {
    0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc((var(--x) - 0.5) * 500px),
                calc((var(--y) - 0.5) * 500px)
            )
            rotate(720deg);

        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Happy Birthday Mom! 🎉</h1>

<p>test!</p>

<div class="balloon-wrapper red-wrapper" onclick="popBalloon(this)">
    <div class="balloon red"></div>
    <div class="string"></div>
</div>

<div class="balloon-wrapper blue-wrapper" onclick="popBalloon(this)">
    <div class="balloon blue"></div>
    <div class="string"></div>
</div>

<div class="balloon-wrapper yellow-wrapper" onclick="popBalloon(this)">
    <div class="balloon yellow"></div>
    <div class="string"></div>
</div>

<script>
function popBalloon(wrapper) {

    let rect = wrapper.getBoundingClientRect();

    // Hide balloon wrapper
    wrapper.style.display = "none";

    // Create confetti
    for (let i = 0; i < 80; i++) {

        let confetti = document.createElement("div");

        confetti.className = "confetti";
        confetti.innerHTML = ["🎉","✨","🎊","💖"][Math.floor(Math.random()*4)];

        confetti.style.left = rect.left + 40 + "px";
        confetti.style.top = rect.top + 40 + "px";

        confetti.style.setProperty("--x", Math.random());
        confetti.style.setProperty("--y", Math.random());

        document.body.appendChild(confetti);

        // Remove confetti later
        setTimeout(() => {
            confetti.remove();
        }, 2000);
    }
}
</script>

</body>
</html>
