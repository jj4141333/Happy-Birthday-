<!DOCTYPE html>
<html>
<head>
<title>Birthday Card</title>
<meta name="robots" content="noindex">
    
<style>
    
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #FF87D8, #37BFC4);
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 60px;
    font-size: 60px;
    color: white;
    text-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

p {
    font-size: 24px;
    color: white;
}

#final-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 50px;
    color: white;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: none;
}

.balloon-wrapper {
    position: absolute;
    animation:
        rise 2s ease-out,
        float 5s ease-in-out infinite 2s;
}

/* ✅ ONLY CHANGE: smooth movement */
.orange-wrapper {
    left: 900px;
    top: 600px;
    transition: left 0.7s ease, top 0.7s ease;
}

.speech-bubble,
.speech-bubble-2,
.speech-bubble-3,
.speech-bubble-4 {
    position: absolute;
    background: white;
    padding: 15px;
    border-radius: 20px;
    width: 220px;
    font-size: 20px;
    color: black;
    top: -40px;
    left: 120px;
    display: none;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-40px); }
    100% { transform: translateY(0px); }
}

@keyframes rise {
    0% { opacity: 0; margin-top: 100vh; }
    100% { opacity: 1; margin-top: 0; }
}

.balloon {
    width: 110px;
    height: 130px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.red { background: #FF4D6D; }
.orange { background: #FF8C00; }
.blue { background: #4CC9F0; }
.yellow { background: #FFD93D; }
.green { background: #95E06C; }

.confetti {
    position: absolute;
    font-size: 25px;
    animation: explode 2s linear forwards;
}

@keyframes explode {
    0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc((var(--x) - 0.5) * 500px),
                calc((var(--y) - 0.5) * 500px)
            )
            rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Happy Birthday Mom! 🎉</h1>
<p>Click the balloons!</p>

<div class="balloon-wrapper red-wrapper" onclick="popBalloon(this)">
    <div class="balloon red"></div>
</div>

<div class="balloon-wrapper blue-wrapper" onclick="popBalloon(this)">
    <div class="balloon blue"></div>
</div>

<div class="balloon-wrapper yellow-wrapper" onclick="popBalloon(this)">
    <div class="balloon yellow"></div>
</div>

<div class="balloon-wrapper green-wrapper" onclick="popBalloon(this)">
    <div class="balloon green"></div>
</div>

<!-- ORANGE -->
<div class="balloon-wrapper orange-wrapper" onclick="orangeBalloonClick(this)">
    <div class="balloon orange"></div>

    <div class="speech-bubble">WOAH THERE! Who said you could pop me?</div>
    <div class="speech-bubble-2">Quite frankly, I am the greatest Balloon.</div>
    <div class="speech-bubble-3">covefe</div>
    <div class="speech-bubble-4">We're going to make Confetti GREAT again.</div>
</div>

<div id="final-message">
    Happy birthday!! You're the best mom ever! ❤️
</div>

<script>

let poppedBalloons = 0;
let orangeClicks = 0;

/* ✅ POSITIONS FOR ORANGE BALLOON */
let balloonPositions = [
    { left: "300px", top: "200px" },
    { left: "1400px", top: "150px" },
    { left: "700px", top: "500px" },
    { left: "1600px", top: "400px" },
    { left: "900px", top: "250px" }
];

function orangeBalloonClick(wrapper) {

    orangeClicks++;

    /* MOVE ORANGE BALLOON */
    if (orangeClicks <= balloonPositions.length) {
        wrapper.style.left = balloonPositions[orangeClicks - 1].left;
        wrapper.style.top = balloonPositions[orangeClicks - 1].top;
    }

    /* speech bubbles */
    const bubbles = wrapper.querySelectorAll(
        ".speech-bubble, .speech-bubble-2, .speech-bubble-3, .speech-bubble-4"
    );

    bubbles.forEach(b => b.style.display = "none");

    if (orangeClicks >= 2) wrapper.querySelector(".speech-bubble").style.display = "block";
    if (orangeClicks >= 4) wrapper.querySelector(".speech-bubble-2").style.display = "block";
    if (orangeClicks >= 6) wrapper.querySelector(".speech-bubble-3").style.display = "block";
    if (orangeClicks >= 10) wrapper.querySelector(".speech-bubble-4").style.display = "block";

    if (orangeClicks >= 15) popBalloon(wrapper);
}

function popBalloon(wrapper) {

    wrapper.style.display = "none";
    poppedBalloons++;

    if (poppedBalloons >= 5) {
        document.getElementById("final-message").style.display = "block";
    }
}

</script>

</body>
</html>
